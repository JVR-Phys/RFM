<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador - Atajos en Word</title>
  <style>
    /* Eliminar los márgenes por defecto del navegador y ocultar barras de scroll */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f0f13; /* Fondo oscuro tipo cine para que resalte el pixel art */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Contenedor e imagen responsiva en pantalla completa */
    .pantalla-completa-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .imagen-atajos {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* Mantiene la proporción original sin estirar ni deformar a los personajes */
      
      /* Opcional: Optimización para que los bordes de los píxeles se vean súper nítidos en pantallas grandes */
      image-rendering: pixelated; 
      image-rendering: crisp-edges;
    }

    /* Botón flotante discreto para regresar a la página de actividades principal */
    .btn-regresar {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(26, 35, 126, 0.85); /* El azul marino de tu diseño con transparencia */
      color: #ffffff;
      padding: 10px 18px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.2s ease;
      z-index: 10;
    }

    .btn-regresar:hover {
      background-color: rgb(26, 35, 126);
    }
  </style>
</head>
<body>

  <a href="../actividades/act2.html" class="btn-regresar">⬅ Volver a la Práctica</a>

  <div class="pantalla-completa-container">
    <img src="../img/atajos.jpg" alt="Atajos-de-Word" class="imagen-atajos">
  </div>

</body>
</html>
